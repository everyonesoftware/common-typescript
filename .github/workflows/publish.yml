name: Build, Test, and Publish

on:
  push:
    branches:
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for npm trusted publishing (OIDC)
      contents: write   # Required to create and push tags

    steps:
      - name: Debug auth source
        run: |
          echo "NPM_TOKEN length: ${#NPM_TOKEN}"
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          env | sort | grep -i npm || true
          env | sort | grep -i token || true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Debug auth source
        run: |
          echo "NPM_TOKEN length: ${#NPM_TOKEN}"
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          env | sort | grep -i npm || true
          env | sort | grep -i token || true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
        
      - name: Debug auth source
        run: |
          echo "NPM_TOKEN length: ${#NPM_TOKEN}"
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          env | sort | grep -i npm || true
          env | sort | grep -i token || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test-only

      - name: Debug auth source
        run: |
          echo "NPM_TOKEN length: ${#NPM_TOKEN}"
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          env | sort | grep -i npm || true
          env | sort | grep -i token || true

      - name: View current package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          npm view $PACKAGE_NAME

      - name: Publish to npm
        run: npm publish

      - name: Create git tag from package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"